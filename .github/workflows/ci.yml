name: ci

on:
  pull_request:
    branches: [main]
  # The same checks after each merge, so two green PRs that break together show at once.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Fails when config.schema.json is stale: run `pnpm config:schema` and commit it.
      - run: pnpm config:schema && git diff --exit-code packages/core/config.schema.json
      - run: pnpm test
      - run: pnpm build

  # The PWA on bundled Chromium at phone size, against the server app on fakes: parity, offline and the UI smoke.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not cached: a fresh download each run.
      - run: pnpm --filter @doomlearn/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The smoke screenshot, and the error context of any failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-results
          path: apps/web/test-results/

  # The Python side of media on Linux: every tool's lock matches its pyproject, and PDF conversion runs for real.
  # tts and align (Mac-only models) are covered by the TS contract tests and the Mac's real-media tests.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repo-local uv, installed as `pnpm bootstrap` does, on the runner's python3. uv then runs the tools on its
      # own Python 3.12, as on the Mac.
      - run: python3 -m venv packages/media/.uv && packages/media/.uv/bin/pip install -r packages/media/python/requirements-uv.txt
      - run: for project in packages/media/python/*/; do packages/media/.uv/bin/uv lock --check --project "$project"; done
      - run: ../../.uv/bin/uv run --locked pytest
        working-directory: packages/media/python/convert
