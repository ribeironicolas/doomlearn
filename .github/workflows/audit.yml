name: audit

# Reports known advisories in production dependencies. It never gates: an advisory does not block feature work,
# and Dependabot's weekly PRs carry the fixes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile only, so no install. A finding marks the step, never the run.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
