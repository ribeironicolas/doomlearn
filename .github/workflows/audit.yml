name: audit

# Reports known advisories in production dependencies. It never gates: an advisory does not block feature work,
# and Dependabot's weekly PRs carry the fixes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile only, so no install. A finding marks the step, never the run.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
