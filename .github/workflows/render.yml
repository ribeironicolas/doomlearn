name: render

on:
  pull_request:
    branches: [main]
    paths:
      - packages/media/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders the fixture Clip on Linux: Remotion's headless Chrome plus its bundled ffmpeg, no system ffmpeg.
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chrome Headless Shell (~236 MB), keyed on the Remotion version that picks it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/media/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-4.0.534
      - run: pnpm --filter @doomlearn/media exec remotion browser ensure
      # Only if the runner image ever drops Chrome's deps (error: libnspr4.so not found):
      # - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - run: pnpm exec vitest run packages/media/src/render.test.ts
