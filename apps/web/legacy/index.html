<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>doomlearn</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bg:#0b0f17; --fg:#f3f4f6; --muted:#9ca3af; --card:#161c28; --line:#273042; --accent:#facc15; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; overscroll-behavior:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

  /* One Clip per screen */
  .feed { scroll-snap-type:y mandatory; overflow-y:scroll; height:100dvh; }
  .slide { height:100dvh; scroll-snap-align:start; scroll-snap-stop:always; position:relative; overflow:hidden; background:#000; touch-action:pan-y; }
  .slide video { width:100%; height:100%; object-fit:cover; display:block; -webkit-touch-callout:none; user-select:none; }
  .tag { position:absolute; left:12px; right:12px; top:calc(56px + env(safe-area-inset-top)); width:fit-content; font-size:12px; background:#0009; padding:4px 8px; border-radius:99px; }
  .tag b { color:var(--accent); font-weight:600; }
  .tapsound { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); background:#000a; padding:10px 16px; border-radius:99px; font-size:14px; pointer-events:none; z-index:10; }

  /* Right-hand rail, starting ~38% down: above the caption band (~75% down) */
  .rail { position:absolute; right:8px; top:38%; display:flex; flex-direction:column; gap:14px; }
  .rail button { width:52px; height:52px; border-radius:50%; background:#0007; font-size:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .rail small { font-size:9px; color:#ddd; margin-top:-2px; }
  .rail, .tag { transition:opacity .2s; }
  .slide.clean .rail, .slide.clean .tag { opacity:0; pointer-events:none; }

  /* After 3 loops */
  .nudge { position:absolute; left:50%; bottom:calc(6% + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#000b; padding:8px 14px; border-radius:99px; font-size:13px; white-space:nowrap; animation:nudge 1s ease-in-out infinite; pointer-events:none; }
  @keyframes nudge { 0%,100% { transform:translate(-50%,0); } 50% { transform:translate(-50%,-14px); } }

  /* The Passage, after a sideways swipe */
  .passage { position:absolute; inset:0; background:#0b0f17f2; overflow-y:auto; padding:calc(56px + env(safe-area-inset-top)) 20px 40px; transform:translateX(100%); transition:transform .25s; }
  .slide.reading .passage { transform:none; }
  .passage .where { color:var(--accent); font-size:13px; margin:16px 0 6px; }
  .passage p { white-space:pre-wrap; }
  .passage .close { position:absolute; right:10px; top:calc(8px + env(safe-area-inset-top)); width:40px; height:40px; border-radius:50%; background:#0008; font-size:18px; }

  /* Done for today */
  .end { height:100dvh; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:center; padding:24px; gap:12px; }
  .end h2 { font-size:26px; }
  .end p { color:var(--muted); }

  /* 🔍 📚 📥, over every Feed screen */
  .topnav { position:fixed; right:10px; top:calc(8px + env(safe-area-inset-top)); display:flex; gap:6px; z-index:20; }
  .topnav button { width:40px; height:40px; border-radius:50%; background:#0008; font-size:18px; position:relative; }
  .badge { position:absolute; top:-2px; right:-2px; background:var(--bad); font-size:10px; min-width:16px; height:16px; border-radius:8px; line-height:16px; }

  /* Search, inbox and Sources */
  .screen { position:fixed; inset:0; overflow-y:auto; background:var(--bg); z-index:25; }
  .page { padding:calc(56px + env(safe-area-inset-top)) 16px 80px; max-width:880px; margin:0 auto; }
  .page h1 { font-size:22px; margin-bottom:12px; }
  .page h2 { font-size:15px; color:var(--muted); margin:20px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .back { position:fixed; left:10px; top:calc(8px + env(safe-area-inset-top)); z-index:31; width:40px; height:40px; border-radius:50%; background:var(--card); font-size:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .meta { color:var(--muted); font-size:12px; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); margin-left:4px; }
  .chip.ok { color:var(--ok); border-color:var(--ok); } .chip.warn { color:var(--warn); border-color:var(--warn); } .chip.bad { color:var(--bad); border-color:var(--bad); }
  .btn { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; }
  .search { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  .results { margin-top:10px; }
  mark { background:var(--accent); color:#000; border-radius:3px; padding:0 2px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; background:var(--ok); }
  .stuck { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:6px 0; border-top:1px solid var(--line); }
  .drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); }
  .refusal { border-color:var(--bad); color:#fecaca; margin-top:10px; }
  @media (min-width:900px) { .srcgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; } }

  /* One Clip from search or the inbox */
  .player { position:fixed; inset:0; z-index:30; background:#000; }
  .player video { width:100%; height:100%; object-fit:cover; display:block; }

  /* 🚩 reasons, a Passage */
  .scrim { position:fixed; inset:0; background:#0008; z-index:39; }
  .sheet { position:fixed; left:0; right:0; bottom:0; max-height:80dvh; overflow-y:auto; background:var(--card); border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:40; border-top:1px solid var(--line); }
  .sheet h3 { margin-bottom:10px; }
  .sheet .opt { display:block; width:100%; text-align:left; padding:12px; border-radius:10px; border:1px solid var(--line); margin-bottom:8px; }
  .sheet .opt.sel { border-color:var(--accent); }
  .sheet textarea { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px; margin:4px 0 10px; font:inherit; }
  .sheet .where { color:var(--accent); font-size:13px; margin:12px 0 6px; }
  .sheet p { white-space:pre-wrap; }
  .primary { background:var(--accent); color:#000; border-radius:10px; padding:12px 16px; font-weight:600; width:100%; }
  .toast { position:fixed; left:50%; top:calc(60px + env(safe-area-inset-top)); transform:translateX(-50%); background:#111827f0; border:1px solid var(--line); padding:10px 14px; border-radius:12px; z-index:50; font-size:13px; max-width:90vw; }
</style>
</head>
<body>
<main class="feed"><section class="end"></section></main>
<nav class="topnav"><button type="button" data-go="search">🔍</button><button type="button" data-go="sources">📚</button><button type="button" data-go="inbox">📥<span class="badge" hidden></span></button></nav>
<div class="screen" hidden></div>
<div class="tapsound">Tap for sound 🔊</div>
<script src="/app.js"></script>
</body>
</html>
